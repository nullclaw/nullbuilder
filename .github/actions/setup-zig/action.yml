name: Setup Zig
description: Install a pinned Zig version on GitHub-hosted runners.

inputs:
  version:
    description: Zig version to install.
    required: false
    default: "0.16.0"

runs:
  using: composite
  steps:
    - name: Install Zig
      shell: bash
      env:
        ZIG_VERSION: ${{ inputs.version }}
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        set -euo pipefail

        case "${ZIG_VERSION}" in
          ""|*/*|*..*)
            echo "unsupported Zig version: ${ZIG_VERSION}" >&2
            exit 1
            ;;
        esac

        archive_ext="tar.xz"
        exe=""
        case "${RUNNER_OS_NAME}/${RUNNER_ARCH_NAME}" in
          Linux/X64)
            zig_platform="x86_64-linux"
            ;;
          Linux/ARM64)
            zig_platform="aarch64-linux"
            ;;
          macOS/X64)
            zig_platform="x86_64-macos"
            ;;
          macOS/ARM64)
            zig_platform="aarch64-macos"
            ;;
          Windows/X64)
            zig_platform="x86_64-windows"
            archive_ext="zip"
            exe=".exe"
            ;;
          Windows/ARM64)
            zig_platform="aarch64-windows"
            archive_ext="zip"
            exe=".exe"
            ;;
          *)
            echo "unsupported runner: ${RUNNER_OS_NAME}/${RUNNER_ARCH_NAME}" >&2
            exit 1
            ;;
        esac

        file_name="zig-${zig_platform}-${ZIG_VERSION}.${archive_ext}"
        download_url="https://ziglang.org/download/${ZIG_VERSION}/${file_name}"
        work_dir="$(mktemp -d)"
        archive_path="${work_dir}/${file_name}"

        curl -fsSL "${download_url}" -o "${archive_path}"

        if [ "${archive_ext}" = "zip" ]; then
          archive_win_path="$(cygpath -w "${archive_path}")"
          work_win_path="$(cygpath -w "${work_dir}")"
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive_win_path}' -DestinationPath '${work_win_path}' -Force"
        else
          tar -xf "${archive_path}" -C "${work_dir}"
        fi

        zig_dir="${work_dir}/zig-${zig_platform}-${ZIG_VERSION}"
        zig_bin="${zig_dir}/zig${exe}"
        if [ ! -f "${zig_bin}" ]; then
          echo "Zig executable not found at ${zig_bin}" >&2
          exit 1
        fi

        echo "${zig_dir}" >> "${GITHUB_PATH}"
        "${zig_bin}" version
