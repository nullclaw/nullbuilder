name: Setup Zig
description: Install a pinned Zig version on GitHub-hosted runners.

inputs:
  version:
    description: Zig version to install.
    required: false
    default: "0.16.0"

runs:
  using: composite
  steps:
    - name: Install Zig
      uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
      with:
        version: ${{ inputs.version }}
