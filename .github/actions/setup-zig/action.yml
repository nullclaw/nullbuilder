name: Setup Zig
description: Install a pinned Zig version on GitHub-hosted runners.

inputs:
  version:
    description: Zig version to install.
    required: false
    default: "0.16.0"

runs:
  using: composite
  steps:
    - name: Install Zig
      uses: mlugg/setup-zig@v2
      with:
        version: ${{ inputs.version }}
