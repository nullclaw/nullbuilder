name: Package Zig Artifact
description: Write SHA-256 and JSON manifest files for a built Zig binary.

inputs:
  binary:
    description: Path to the copied binary inside the artifact directory.
    required: true
  target:
    description: Nullbuilder target label.
    required: true
  zig_target:
    description: Zig target triple.
    required: true
  version:
    description: Version embedded in the binary.
    required: true
  repository:
    description: GitHub repository name.
    required: true
  commit:
    description: Commit SHA.
    required: true
  run_id:
    description: GitHub Actions run id.
    required: true
  server_url:
    description: GitHub server URL.
    required: true
  built_at:
    description: UTC build timestamp.
    required: true

runs:
  using: composite
  steps:
    - name: Package artifact metadata
      shell: bash
      env:
        PACKAGE_BINARY: ${{ inputs.binary }}
        PACKAGE_TARGET: ${{ inputs.target }}
        PACKAGE_ZIG_TARGET: ${{ inputs.zig_target }}
        PACKAGE_VERSION: ${{ inputs.version }}
        PACKAGE_REPOSITORY: ${{ inputs.repository }}
        PACKAGE_COMMIT: ${{ inputs.commit }}
        PACKAGE_RUN_ID: ${{ inputs.run_id }}
        PACKAGE_SERVER_URL: ${{ inputs.server_url }}
        PACKAGE_BUILT_AT: ${{ inputs.built_at }}
      run: |
        zig run "$GITHUB_ACTION_PATH/package_artifact.zig" -- \
          --binary "${PACKAGE_BINARY}" \
          --target "${PACKAGE_TARGET}" \
          --zig-target "${PACKAGE_ZIG_TARGET}" \
          --version "${PACKAGE_VERSION}" \
          --repository "${PACKAGE_REPOSITORY}" \
          --commit "${PACKAGE_COMMIT}" \
          --run-id "${PACKAGE_RUN_ID}" \
          --server-url "${PACKAGE_SERVER_URL}" \
          --built-at "${PACKAGE_BUILT_AT}"
