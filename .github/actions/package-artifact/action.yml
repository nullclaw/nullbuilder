name: Package Zig Artifact
description: Write SHA-256 and JSON manifest files for a built Zig binary.

inputs:
  binary:
    description: Path to the copied binary inside the artifact directory.
    required: true
  target:
    description: Nullbuilder target label.
    required: true
  zig_target:
    description: Zig target triple.
    required: true
  version:
    description: Version embedded in the binary.
    required: true
  repository:
    description: GitHub repository name.
    required: true
  commit:
    description: Full 40-character commit SHA.
    required: true
  run_id:
    description: GitHub Actions run id.
    required: true
  server_url:
    description: GitHub server URL.
    required: true
  built_at:
    description: UTC build timestamp.
    required: true

runs:
  using: composite
  steps:
    - name: Package artifact metadata
      shell: bash
      env:
        PACKAGE_BINARY: ${{ inputs.binary }}
        PACKAGE_TARGET: ${{ inputs.target }}
        PACKAGE_ZIG_TARGET: ${{ inputs.zig_target }}
        PACKAGE_VERSION: ${{ inputs.version }}
        PACKAGE_REPOSITORY: ${{ inputs.repository }}
        PACKAGE_COMMIT: ${{ inputs.commit }}
        PACKAGE_RUN_ID: ${{ inputs.run_id }}
        PACKAGE_SERVER_URL: ${{ inputs.server_url }}
        PACKAGE_BUILT_AT: ${{ inputs.built_at }}
      run: |
        zig run \
          --dep action_args \
          --dep action_json \
          --dep action_paths \
          --dep action_values \
          -Mroot="$GITHUB_ACTION_PATH/package_artifact.zig" \
          --dep action_values \
          -Maction_json="$GITHUB_ACTION_PATH/../action_json.zig" \
          --dep action_text \
          -Maction_args="$GITHUB_ACTION_PATH/../action_args.zig" \
          --dep text_safety \
          -Maction_paths="$GITHUB_ACTION_PATH/../action_paths.zig" \
          --dep action_text \
          --dep repository_safety \
          --dep text_safety \
          -Maction_values="$GITHUB_ACTION_PATH/../action_values.zig" \
          --dep text_safety \
          -Maction_text="$GITHUB_ACTION_PATH/../action_text.zig" \
          -Mrepository_safety="$GITHUB_ACTION_PATH/../../../src/zig/repository_safety.zig" \
          -Mtext_safety="$GITHUB_ACTION_PATH/../../../src/zig/text_safety.zig" \
          -- \
          --binary "${PACKAGE_BINARY}" \
          --target "${PACKAGE_TARGET}" \
          --zig-target "${PACKAGE_ZIG_TARGET}" \
          --version "${PACKAGE_VERSION}" \
          --repository "${PACKAGE_REPOSITORY}" \
          --commit "${PACKAGE_COMMIT}" \
          --run-id "${PACKAGE_RUN_ID}" \
          --server-url "${PACKAGE_SERVER_URL}" \
          --built-at "${PACKAGE_BUILT_AT}"
