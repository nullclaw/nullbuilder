name: Nightly Decide
description: Decide whether a scheduled nightly should build this commit.

inputs:
  runs_json:
    description: Path to a GitHub Actions workflow-runs JSON payload.
    required: true
  current_run_id:
    description: Current GitHub Actions run id.
    required: true
  head_sha:
    description: Full 40-character commit SHA being considered for nightly build.
    required: true
  force:
    description: Force a rebuild even if an earlier successful nightly exists.
    required: false
    default: "false"
  workflow_name:
    description: Workflow name to match when deduplicating.
    required: false
    default: "Nightly"

outputs:
  should_build:
    description: Whether the build job should run.
    value: ${{ steps.decide.outputs.should_build }}
  reason:
    description: Decision reason.
    value: ${{ steps.decide.outputs.reason }}
  matched_run_id:
    description: Existing successful run id, when skipped.
    value: ${{ steps.decide.outputs.matched_run_id }}
  matched_run_url:
    description: Existing successful run URL, when skipped.
    value: ${{ steps.decide.outputs.matched_run_url }}

runs:
  using: composite
  steps:
    - name: Decide
      id: decide
      shell: bash
      env:
        DECIDE_CURRENT_RUN_ID: ${{ inputs.current_run_id }}
        DECIDE_HEAD_SHA: ${{ inputs.head_sha }}
        DECIDE_RUNS_JSON: ${{ inputs.runs_json }}
        DECIDE_WORKFLOW_NAME: ${{ inputs.workflow_name }}
        FORCE_NIGHTLY: ${{ inputs.force }}
      run: |
        set -euo pipefail

        temp_root="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
        case "$temp_root" in
          "" | -* | *$'\n'* | *$'\r'*)
            echo "invalid temporary directory" >&2
            exit 1
            ;;
        esac

        decision_file="$(mktemp "${temp_root}/nightly-decision.XXXXXX")"
        runs_json_file="$(mktemp "${temp_root}/nightly-runs.XXXXXX")"
        trap 'rm -f "${decision_file}"; rm -f "${runs_json_file}"' EXIT
        cp -- "${DECIDE_RUNS_JSON}" "${runs_json_file}"
        runs_json_name="${runs_json_file##*/}"

        force_args=()
        if [ "${FORCE_NIGHTLY}" = "true" ]; then
          force_args+=(--force)
        fi

        (
          cd "${temp_root}"
          zig run \
            --dep action_args \
            --dep action_json \
            --dep action_paths \
            --dep action_values \
            -Mroot="$GITHUB_ACTION_PATH/nightly_decide.zig" \
            --dep action_values \
            --dep json_fields \
            -Maction_json="$GITHUB_ACTION_PATH/../action_json.zig" \
            --dep action_text \
            -Maction_args="$GITHUB_ACTION_PATH/../action_args.zig" \
            --dep text_safety \
            -Maction_paths="$GITHUB_ACTION_PATH/../action_paths.zig" \
            --dep repository_safety \
            --dep text_safety \
            -Maction_values="$GITHUB_ACTION_PATH/../action_values.zig" \
            --dep text_safety \
            -Maction_text="$GITHUB_ACTION_PATH/../action_text.zig" \
            --dep text_safety \
            -Mrepository_safety="$GITHUB_ACTION_PATH/../../../src/zig/repository_safety.zig" \
            --dep json_safety \
            -Mjson_fields="$GITHUB_ACTION_PATH/../../../src/zig/json_fields.zig" \
            --dep text_safety \
            -Mjson_safety="$GITHUB_ACTION_PATH/../../../src/zig/json_safety.zig" \
            -Mtext_safety="$GITHUB_ACTION_PATH/../../../src/zig/text_safety.zig" \
            -- \
            --runs-json "${runs_json_name}" \
            --current-run-id "${DECIDE_CURRENT_RUN_ID}" \
            --head-sha "${DECIDE_HEAD_SHA}" \
            --workflow-name "${DECIDE_WORKFLOW_NAME}" \
            "${force_args[@]}"
        ) > "${decision_file}"

        cat "${decision_file}"
        cat "${decision_file}" >> "$GITHUB_OUTPUT"

        reason="$(grep -m1 '^reason=' "${decision_file}" | cut -d= -f2-)"
        should_build="$(grep -m1 '^should_build=' "${decision_file}" | cut -d= -f2-)"
        matched_url="$(grep -m1 '^matched_run_url=' "${decision_file}" | cut -d= -f2- || true)"
        {
          echo "## Nightly preflight"
          echo ""
          echo "- Commit: \`${DECIDE_HEAD_SHA}\`"
          echo "- Decision: \`${should_build}\`"
          echo "- Reason: \`${reason}\`"
          if [ -n "${matched_url}" ]; then
            echo "- Existing run: ${matched_url}"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
