name: Nightly Decide
description: Decide whether a scheduled nightly should build this commit.

inputs:
  runs_json:
    description: Path to a GitHub Actions workflow-runs JSON payload.
    required: true
  current_run_id:
    description: Current GitHub Actions run id.
    required: true
  head_sha:
    description: Commit SHA being considered for nightly build.
    required: true
  force:
    description: Force a rebuild even if an earlier successful nightly exists.
    required: false
    default: "false"
  workflow_name:
    description: Workflow name to match when deduplicating.
    required: false
    default: "Nightly"

outputs:
  should_build:
    description: Whether the build job should run.
    value: ${{ steps.decide.outputs.should_build }}
  reason:
    description: Decision reason.
    value: ${{ steps.decide.outputs.reason }}
  matched_run_id:
    description: Existing successful run id, when skipped.
    value: ${{ steps.decide.outputs.matched_run_id }}
  matched_run_url:
    description: Existing successful run URL, when skipped.
    value: ${{ steps.decide.outputs.matched_run_url }}

runs:
  using: composite
  steps:
    - name: Decide
      id: decide
      shell: bash
      env:
        DECIDE_CURRENT_RUN_ID: ${{ inputs.current_run_id }}
        DECIDE_HEAD_SHA: ${{ inputs.head_sha }}
        DECIDE_RUNS_JSON: ${{ inputs.runs_json }}
        DECIDE_WORKFLOW_NAME: ${{ inputs.workflow_name }}
        FORCE_NIGHTLY: ${{ inputs.force }}
      run: |
        force_args=()
        if [ "${FORCE_NIGHTLY}" = "true" ]; then
          force_args+=(--force)
        fi

        zig run \
          --dep action_args \
          --dep action_paths \
          --dep action_values \
          -Mroot="$GITHUB_ACTION_PATH/nightly_decide.zig" \
          -Maction_args="$GITHUB_ACTION_PATH/../action_args.zig" \
          -Maction_paths="$GITHUB_ACTION_PATH/../action_paths.zig" \
          -Maction_values="$GITHUB_ACTION_PATH/../action_values.zig" \
          -- \
          --runs-json "${DECIDE_RUNS_JSON}" \
          --current-run-id "${DECIDE_CURRENT_RUN_ID}" \
          --head-sha "${DECIDE_HEAD_SHA}" \
          --workflow-name "${DECIDE_WORKFLOW_NAME}" \
          "${force_args[@]}" > nightly-decision.env

        cat nightly-decision.env
        cat nightly-decision.env >> "$GITHUB_OUTPUT"

        reason="$(grep '^reason=' nightly-decision.env | cut -d= -f2-)"
        should_build="$(grep '^should_build=' nightly-decision.env | cut -d= -f2-)"
        matched_url="$(grep '^matched_run_url=' nightly-decision.env | cut -d= -f2- || true)"
        {
          echo "## Nightly preflight"
          echo ""
          echo "- Commit: \`${DECIDE_HEAD_SHA}\`"
          echo "- Decision: \`${should_build}\`"
          echo "- Reason: \`${reason}\`"
          if [ -n "${matched_url}" ]; then
            echo "- Existing run: ${matched_url}"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
