name: Zig CI

on:
  workflow_call:
    inputs:
      binary_name:
        description: Binary name produced under zig-out/bin.
        required: true
        type: string
      artifact_prefix:
        description: Prefix for uploaded CI artifacts.
        required: false
        type: string
        default: ""
      zig_version:
        description: Zig version to install.
        required: false
        type: string
        default: "0.16.0"
      targets_json:
        description: JSON array of target matrix entries. Each entry needs os, target, and zig_target.
        required: false
        type: string
        default: >-
          [
            {"os":"ubuntu-latest","target":"linux-x86_64","zig_target":"x86_64-linux-musl"},
            {"os":"macos-latest","target":"macos-aarch64","zig_target":"aarch64-macos"},
            {"os":"windows-latest","target":"windows-x86_64","zig_target":"x86_64-windows"}
          ]
      node_version:
        description: Optional Node.js version to install before custom commands.
        required: false
        type: string
        default: ""
      node_cache_dependency_path:
        description: Optional npm dependency path for setup-node caching.
        required: false
        type: string
        default: ""
      setup_command:
        description: Optional command run after tool setup and before tests.
        required: false
        type: string
        default: ""
      pre_test_command:
        description: Optional command run immediately before tests.
        required: false
        type: string
        default: ""
      test_command:
        description: Command used to run tests.
        required: false
        type: string
        default: "zig build test --summary all"
      pre_build_command:
        description: Optional command run immediately before ReleaseSmall builds.
        required: false
        type: string
        default: ""
      build_args:
        description: Extra arguments appended to ReleaseSmall zig build.
        required: false
        type: string
        default: ""
      e2e_command:
        description: Optional command run after ReleaseSmall build on one matrix target.
        required: false
        type: string
        default: ""
      e2e_target:
        description: Matrix target name that should run e2e_command.
        required: false
        type: string
        default: "linux-x86_64"
      upload_artifacts:
        description: Upload host binaries as CI artifacts.
        required: false
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.targets_json) }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Zig
        uses: nullclaw/nullbuilder/.github/actions/setup-zig@v1
        with:
          version: ${{ inputs.zig_version }}

      - name: Set up Node.js
        if: inputs.node_version != '' && inputs.node_cache_dependency_path == ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Set up Node.js with npm cache
        if: inputs.node_version != '' && inputs.node_cache_dependency_path != ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.node_cache_dependency_path }}

      - name: Resolve artifact prefix
        id: artifact
        run: |
          artifact_prefix="${{ inputs.artifact_prefix }}"
          if [ -z "${artifact_prefix}" ]; then
            artifact_prefix="${{ inputs.binary_name }}"
          fi
          echo "prefix=${artifact_prefix}" >> "$GITHUB_OUTPUT"

      - name: Cache Zig build outputs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ matrix.target }}-${{ hashFiles('src/**/*.zig', 'build.zig', 'build.zig.zon', 'vendor/**') }}
          restore-keys: zig-${{ matrix.target }}-

      - name: Run setup command
        if: inputs.setup_command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup_command }}
        run: bash -euo pipefail -c "$SETUP_COMMAND"

      - name: Run pre-test command
        if: inputs.pre_test_command != ''
        env:
          PRE_TEST_COMMAND: ${{ inputs.pre_test_command }}
        run: bash -euo pipefail -c "$PRE_TEST_COMMAND"

      - name: Run tests
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
        run: ${TEST_COMMAND} 2>&1 | tee test-output.txt

      - name: Run pre-build command
        if: inputs.pre_build_command != ''
        env:
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -euo pipefail -c "$PRE_BUILD_COMMAND"

      - name: Build ReleaseSmall
        env:
          EXTRA_BUILD_ARGS: ${{ inputs.build_args }}
        run: |
          zig_args=(
            -Dtarget=${{ matrix.zig_target }}
            -Doptimize=ReleaseSmall
          )
          if [ -n "${EXTRA_BUILD_ARGS}" ]; then
            read -r -a extra_args <<< "${EXTRA_BUILD_ARGS}"
            zig_args+=("${extra_args[@]}")
          fi
          zig build "${zig_args[@]}"

      - name: Run E2E command
        if: inputs.e2e_command != '' && matrix.target == inputs.e2e_target
        env:
          E2E_COMMAND: ${{ inputs.e2e_command }}
        run: bash -euo pipefail -c "$E2E_COMMAND"

      - name: Preserve host binary
        if: inputs.upload_artifacts
        run: |
          mkdir -p ci-artifacts
          cp "zig-out/bin/${{ inputs.binary_name }}${{ runner.os == 'Windows' && '.exe' || '' }}" "ci-artifacts/${{ inputs.binary_name }}${{ runner.os == 'Windows' && '.exe' || '' }}"

      - name: Job summary
        if: always()
        run: |
          echo "## Zig CI - ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"

          if [ -f test-output.txt ]; then
            TESTS=$(grep -o '[0-9]*/[0-9]* tests passed' test-output.txt | head -1 || true)
            RSS=$(grep 'run test' test-output.txt | grep -o 'MaxRSS:[^ ]*' | head -1 | cut -d: -f2 || true)
            echo "| Tests | ${TESTS:-n/a} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Test MaxRSS | ${RSS:-n/a} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          BIN="ci-artifacts/${{ inputs.binary_name }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="ci-artifacts/${{ inputs.binary_name }}.exe"
          fi
          if [ -f "$BIN" ]; then
            SIZE=$(wc -c < "$BIN" | tr -d ' ')
            SIZE_HR=$(awk "BEGIN {printf \"%.1f MB\", $SIZE / 1048576}")
            echo "| Binary (ReleaseSmall) | ${SIZE_HR} (${SIZE} bytes) |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload binary
        if: inputs.upload_artifacts && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact.outputs.prefix }}-${{ matrix.target }}
          path: ci-artifacts/${{ inputs.binary_name }}${{ runner.os == 'Windows' && '.exe' || '' }}
