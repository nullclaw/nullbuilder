name: CI

env:
  ZIG_VERSION: "0.16.0"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  self:
    name: Self build through nullbuilder
    uses: ./.github/workflows/zig-ci.yml
    permissions:
      contents: read
    with:
      binary_name: nullbuilder-tui
      artifact_prefix: nullbuilder
      node_version: "24"
      node_cache_dependency_path: package-lock.json
      setup_command: npm ci --no-audit --no-fund
      test_command: |
        npm run test:ts
        npm run typecheck
        npm run check
        npm run build
        zig build test --summary all
        zig build --summary all
      e2e_command: zig build tui -- --help

  test:
    name: Test actions
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Test nightly decision helper
        run: zig test .github/actions/nightly-decide/nightly_decide.zig

      - name: Test artifact package helper
        run: zig test .github/actions/package-artifact/package_artifact.zig
