name: CI

env:
  ZIG_VERSION: "0.16.0"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  self:
    name: Self build through nullbuilder
    uses: ./.github/workflows/zig-ci.yml
    permissions:
      contents: read
    with:
      binary_name: nullbuilder-tui
      artifact_prefix: nullbuilder
      node_version: "24"
      node_cache_dependency_path: package-lock.json
      setup_command: npm ci --no-audit --no-fund
      test_command: |
        npm run test:ts
        npm run typecheck
        npm run check
        npm run build
        zig build test --summary all
        zig build --summary all
      e2e_command: zig build tui -- --help

  test:
    name: Test actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Test nightly decision helper
        run: >-
          zig test
          --dep action_args
          --dep action_json
          --dep action_paths
          --dep action_values
          -Mroot=.github/actions/nightly-decide/nightly_decide.zig
          --dep action_values
          -Maction_json=.github/actions/action_json.zig
          --dep action_text
          -Maction_args=.github/actions/action_args.zig
          --dep text_safety
          -Maction_paths=.github/actions/action_paths.zig
          --dep action_text
          --dep repository_safety
          --dep text_safety
          -Maction_values=.github/actions/action_values.zig
          --dep text_safety
          -Maction_text=.github/actions/action_text.zig
          --dep text_safety
          -Mrepository_safety=src/zig/repository_safety.zig
          -Mtext_safety=src/zig/text_safety.zig

      - name: Test artifact package helper
        run: >-
          zig test
          --dep action_args
          --dep action_json
          --dep action_paths
          --dep action_values
          -Mroot=.github/actions/package-artifact/package_artifact.zig
          --dep action_values
          -Maction_json=.github/actions/action_json.zig
          --dep action_text
          -Maction_args=.github/actions/action_args.zig
          --dep text_safety
          -Maction_paths=.github/actions/action_paths.zig
          --dep action_text
          --dep repository_safety
          --dep text_safety
          -Maction_values=.github/actions/action_values.zig
          --dep text_safety
          -Maction_text=.github/actions/action_text.zig
          --dep text_safety
          -Mrepository_safety=src/zig/repository_safety.zig
          -Mtext_safety=src/zig/text_safety.zig
