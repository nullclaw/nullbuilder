name: Zig Nightly

on:
  workflow_call:
    inputs:
      binary_name:
        description: Binary name produced under zig-out/bin.
        required: true
        type: string
      artifact_prefix:
        description: Prefix for uploaded artifacts.
        required: false
        type: string
        default: ""
      zig_version:
        description: Zig version to install.
        required: false
        type: string
        default: "0.16.0"
      android_api_level:
        description: Android API level for Android targets.
        required: false
        type: string
        default: "24"
      android_ndk_version:
        description: Android NDK version for Android targets.
        required: false
        type: string
        default: "29.0.14206865"
      targets_json:
        description: JSON array of nightly target matrix entries.
        required: false
        type: string
        default: >-
          [
            {"os":"ubuntu-latest","target":"linux-x86_64","zig_target":"x86_64-linux-musl","zig_cpu":"","ext":""},
            {"os":"ubuntu-latest","target":"linux-aarch64","zig_target":"aarch64-linux-musl","zig_cpu":"","ext":""},
            {"os":"ubuntu-latest","target":"linux-arm32-gnu","zig_target":"arm-linux-gnueabihf","zig_cpu":"","ext":""},
            {"os":"ubuntu-latest","target":"linux-arm32-musl","zig_target":"arm-linux-musleabihf","zig_cpu":"","ext":""},
            {"os":"ubuntu-latest","target":"linux-riscv64","zig_target":"riscv64-linux-musl","zig_cpu":"","ext":""},
            {"os":"ubuntu-latest","target":"android-aarch64","zig_target":"aarch64-linux-android","zig_cpu":"","ext":""},
            {"os":"ubuntu-latest","target":"android-armv7","zig_target":"arm-linux-androideabi","zig_cpu":"baseline+v7a","ext":""},
            {"os":"ubuntu-latest","target":"android-x86_64","zig_target":"x86_64-linux-android","zig_cpu":"","ext":""},
            {"os":"macos-latest","target":"macos-aarch64","zig_target":"aarch64-macos","zig_cpu":"","ext":""},
            {"os":"macos-latest","target":"macos-x86_64","zig_target":"x86_64-macos","zig_cpu":"","ext":""},
            {"os":"windows-latest","target":"windows-x86_64","zig_target":"x86_64-windows","zig_cpu":"","ext":".exe"},
            {"os":"windows-latest","target":"windows-aarch64","zig_target":"aarch64-windows","zig_cpu":"","ext":".exe"}
          ]
      node_version:
        description: Optional Node.js version to install before custom commands.
        required: false
        type: string
        default: ""
      node_cache_dependency_path:
        description: Optional npm dependency path for setup-node caching.
        required: false
        type: string
        default: ""
      pre_build_command:
        description: Optional command run before each nightly build. BUILD_VERSION is available.
        required: false
        type: string
        default: ""
      build_args:
        description: Extra arguments appended to zig build.
        required: false
        type: string
        default: ""
      retention_days:
        description: Nightly artifact retention period.
        required: false
        type: number
        default: 14
      force:
        description: Build even if this commit already has a successful nightly run.
        required: false
        type: boolean
        default: false
      dedupe_workflow_name:
        description: Caller workflow name used for nightly dedupe.
        required: false
        type: string
        default: "Nightly"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
      reason: ${{ steps.decision.outputs.reason }}
      version: ${{ steps.version.outputs.value }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      artifact_prefix: ${{ steps.version.outputs.artifact_prefix }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Zig
        uses: nullclaw/nullbuilder/.github/actions/setup-zig@v1
        with:
          version: ${{ inputs.zig_version }}

      - name: Resolve nightly version
        id: version
        run: |
          short_sha="${GITHUB_SHA::7}"
          build_date="$(date -u +%Y%m%d)"
          artifact_prefix="${{ inputs.artifact_prefix }}"
          if [ -z "${artifact_prefix}" ]; then
            artifact_prefix="${{ inputs.binary_name }}"
          fi
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "value=nightly-${build_date}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "artifact_prefix=${artifact_prefix}" >> "$GITHUB_OUTPUT"

      - name: Fetch previous successful workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs"
          query="branch=${GITHUB_REF_NAME}&status=success&head_sha=${GITHUB_SHA}&per_page=100"
          http_status="$(
            curl -sS -L \
              -o previous-nightly-runs.json \
              -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api_url}?${query}"
          )"

          if [ "${http_status}" != "200" ]; then
            echo "failed to fetch workflow history: HTTP ${http_status}" >&2
            cat previous-nightly-runs.json >&2
            exit 1
          fi

      - name: Decide whether to build
        id: decision
        uses: nullclaw/nullbuilder/.github/actions/nightly-decide@v1
        with:
          runs_json: previous-nightly-runs.json
          current_run_id: ${{ github.run_id }}
          head_sha: ${{ github.sha }}
          workflow_name: ${{ inputs.dedupe_workflow_name }}
          force: ${{ inputs.force }}

  build:
    name: Build (${{ matrix.target }})
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.targets_json) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Zig
        uses: nullclaw/nullbuilder/.github/actions/setup-zig@v1
        with:
          version: ${{ inputs.zig_version }}

      - name: Set up Node.js
        if: inputs.node_version != '' && inputs.node_cache_dependency_path == ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Set up Node.js with npm cache
        if: inputs.node_version != '' && inputs.node_cache_dependency_path != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.node_cache_dependency_path }}

      - name: Set up JDK 17
        if: startsWith(matrix.target, 'android-')
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: startsWith(matrix.target, 'android-')
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''

      - name: Install Android NDK
        if: startsWith(matrix.target, 'android-')
        env:
          ANDROID_NDK_VERSION: ${{ inputs.android_ndk_version }}
        run: sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"

      - name: Export Android NDK paths
        if: startsWith(matrix.target, 'android-')
        env:
          ANDROID_API_LEVEL: ${{ inputs.android_api_level }}
          ANDROID_NDK_VERSION: ${{ inputs.android_ndk_version }}
        run: |
          NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          SYSROOT="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          LIBC_FILE="$RUNNER_TEMP/android-libc-${{ matrix.target }}.txt"
          echo "ANDROID_NDK_ROOT=${NDK_ROOT}" >> "$GITHUB_ENV"
          echo "ZIG_ANDROID_SYSROOT=${SYSROOT}" >> "$GITHUB_ENV"
          echo "ZIG_ANDROID_LIBC_FILE=${LIBC_FILE}" >> "$GITHUB_ENV"
          cat > "${LIBC_FILE}" <<EOF
          include_dir=${SYSROOT}/usr/include/${{ matrix.zig_target }}
          sys_include_dir=${SYSROOT}/usr/include
          crt_dir=${SYSROOT}/usr/lib/${{ matrix.zig_target }}/${ANDROID_API_LEVEL}
          msvc_lib_dir=
          kernel32_lib_dir=
          gcc_dir=
          EOF

      - name: Run pre-build command
        if: inputs.pre_build_command != ''
        env:
          BUILD_VERSION: ${{ needs.preflight.outputs.version }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -euo pipefail -c "$PRE_BUILD_COMMAND"

      - name: Build ReleaseSmall
        env:
          ANDROID_API_LEVEL: ${{ inputs.android_api_level }}
          EXTRA_BUILD_ARGS: ${{ inputs.build_args }}
        run: |
          zig_target="${{ matrix.zig_target }}"
          if [[ "${{ matrix.target }}" == android-* ]]; then
            zig_target="${zig_target}.${ANDROID_API_LEVEL}"
          fi

          zig_args=(
            -Doptimize=ReleaseSmall
            -Dtarget=${zig_target}
            -Dversion=${{ needs.preflight.outputs.version }}
          )
          if [ -n "${{ matrix.zig_cpu }}" ]; then
            zig_args+=(-Dcpu=${{ matrix.zig_cpu }})
          fi
          if [[ "${{ matrix.target }}" == android-* ]]; then
            zig_args+=(--libc "${ZIG_ANDROID_LIBC_FILE}")
          fi
          if [ -n "${EXTRA_BUILD_ARGS}" ]; then
            read -r -a extra_args <<< "${EXTRA_BUILD_ARGS}"
            zig_args+=("${extra_args[@]}")
          fi
          zig build "${zig_args[@]}"

      - name: Package nightly artifact
        env:
          ARTIFACT_PREFIX: ${{ needs.preflight.outputs.artifact_prefix }}
        run: |
          mkdir -p nightly-artifacts
          binary="zig-out/bin/${{ inputs.binary_name }}${{ matrix.ext }}"
          out="nightly-artifacts/${ARTIFACT_PREFIX}-${{ matrix.target }}${{ matrix.ext }}"
          cp "${binary}" "${out}"
          echo "artifact_binary=${out}" >> "$GITHUB_ENV"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Write artifact metadata
        uses: nullclaw/nullbuilder/.github/actions/package-artifact@v1
        with:
          binary: ${{ env.artifact_binary }}
          target: ${{ matrix.target }}
          zig_target: ${{ matrix.zig_target }}
          version: ${{ needs.preflight.outputs.version }}
          repository: ${{ github.repository }}
          commit: ${{ github.sha }}
          run_id: ${{ github.run_id }}
          server_url: ${{ github.server_url }}
          built_at: ${{ env.built_at }}

      - name: Upload nightly artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ needs.preflight.outputs.artifact_prefix }}-nightly-${{ needs.preflight.outputs.short_sha }}-${{ matrix.target }}
          path: nightly-artifacts/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
