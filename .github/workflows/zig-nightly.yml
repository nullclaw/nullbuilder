name: Zig Nightly

on:
  workflow_call:
    inputs:
      binary_name:
        description: Binary name produced under zig-out/bin.
        required: true
        type: string
      artifact_prefix:
        description: Prefix for uploaded artifacts.
        required: false
        type: string
        default: ""
      zig_version:
        description: Zig version to install.
        required: false
        type: string
        default: "0.16.0"
      android_api_level:
        description: Android API level for Android targets.
        required: false
        type: string
        default: "24"
      android_ndk_version:
        description: Android NDK version for Android targets.
        required: false
        type: string
        default: "29.0.14206865"
      targets_json:
        description: JSON array of nightly target matrix entries.
        required: false
        type: string
        default: >-
          [
            {"os":"ubuntu-latest","target":"linux-x86_64","zig_target":"x86_64-linux-musl","zig_cpu":"","ext":""},
            {"os":"ubuntu-latest","target":"linux-aarch64","zig_target":"aarch64-linux-musl","zig_cpu":"","ext":""},
            {"os":"ubuntu-latest","target":"linux-arm32-gnu","zig_target":"arm-linux-gnueabihf","zig_cpu":"","ext":""},
            {"os":"ubuntu-latest","target":"linux-arm32-musl","zig_target":"arm-linux-musleabihf","zig_cpu":"","ext":""},
            {"os":"ubuntu-latest","target":"linux-riscv64","zig_target":"riscv64-linux-musl","zig_cpu":"","ext":""},
            {"os":"ubuntu-latest","target":"android-aarch64","zig_target":"aarch64-linux-android","zig_cpu":"","ext":""},
            {"os":"ubuntu-latest","target":"android-armv7","zig_target":"arm-linux-androideabi","zig_cpu":"baseline+v7a","ext":""},
            {"os":"ubuntu-latest","target":"android-x86_64","zig_target":"x86_64-linux-android","zig_cpu":"","ext":""},
            {"os":"macos-latest","target":"macos-aarch64","zig_target":"aarch64-macos","zig_cpu":"","ext":""},
            {"os":"macos-latest","target":"macos-x86_64","zig_target":"x86_64-macos","zig_cpu":"","ext":""},
            {"os":"windows-latest","target":"windows-x86_64","zig_target":"x86_64-windows","zig_cpu":"","ext":".exe"},
            {"os":"windows-latest","target":"windows-aarch64","zig_target":"aarch64-windows","zig_cpu":"","ext":".exe"}
          ]
      node_version:
        description: Optional Node.js version to install before custom commands.
        required: false
        type: string
        default: ""
      node_cache_dependency_path:
        description: Optional npm dependency path for setup-node caching.
        required: false
        type: string
        default: ""
      pre_build_command:
        description: Optional command run before each nightly build. BUILD_VERSION is available.
        required: false
        type: string
        default: ""
      build_args:
        description: Extra arguments appended to zig build.
        required: false
        type: string
        default: ""
      retention_days:
        description: Nightly artifact retention period.
        required: false
        type: number
        default: 14
      force:
        description: Build even if this commit already has a successful nightly run.
        required: false
        type: boolean
        default: false
      dedupe_workflow_name:
        description: Caller workflow name used for nightly dedupe.
        required: false
        type: string
        default: "Nightly"
      publish_release:
        description: Publish or update a GitHub prerelease with nightly artifacts.
        required: false
        type: boolean
        default: false
      release_tag:
        description: Tag name for the rolling nightly prerelease.
        required: false
        type: string
        default: "nightly"
      release_title:
        description: Title prefix for the rolling nightly prerelease.
        required: false
        type: string
        default: "Nightly"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
      reason: ${{ steps.decision.outputs.reason }}
      version: ${{ steps.version.outputs.value }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      artifact_prefix: ${{ steps.version.outputs.artifact_prefix }}
      built_at: ${{ steps.version.outputs.built_at }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Zig
        uses: nullclaw/nullbuilder/.github/actions/setup-zig@v1
        with:
          version: ${{ inputs.zig_version }}

      - name: Resolve nightly version
        id: version
        env:
          RAW_ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
          RAW_BINARY_NAME: ${{ inputs.binary_name }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          build_date="$(date -u +%Y%m%d)"
          if [[ ! "${RAW_BINARY_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || [[ "${RAW_BINARY_NAME}" == *..* ]]; then
            echo "invalid binary_name: use a basename containing only letters, numbers, dots, underscores, and dashes" >&2
            exit 1
          fi

          artifact_prefix="${RAW_ARTIFACT_PREFIX}"
          if [ -z "${artifact_prefix}" ]; then
            artifact_prefix="${RAW_BINARY_NAME}"
          fi
          if [[ ! "${artifact_prefix}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || [[ "${artifact_prefix}" == *..* ]]; then
            echo "invalid artifact_prefix: use letters, numbers, dots, underscores, and dashes" >&2
            exit 1
          fi
          printf 'short_sha=%s\n' "${short_sha}" >> "$GITHUB_OUTPUT"
          printf 'built_at=%s\n' "${built_at}" >> "$GITHUB_OUTPUT"
          printf 'value=nightly-%s-%s\n' "${build_date}" "${short_sha}" >> "$GITHUB_OUTPUT"
          printf 'artifact_prefix=%s\n' "${artifact_prefix}" >> "$GITHUB_OUTPUT"

      - name: Fetch previous successful workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs"
          query="branch=${GITHUB_REF_NAME}&status=success&head_sha=${GITHUB_SHA}&per_page=100"
          http_status="$(
            curl -sS -L --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
              -o previous-nightly-runs.json \
              -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api_url}?${query}"
          )"

          if [ "${http_status}" != "200" ]; then
            echo "failed to fetch workflow history: HTTP ${http_status}" >&2
            head -c 4096 previous-nightly-runs.json >&2
            printf '\n' >&2
            exit 1
          fi

      - name: Decide whether to build
        id: decision
        uses: nullclaw/nullbuilder/.github/actions/nightly-decide@v1
        with:
          runs_json: previous-nightly-runs.json
          current_run_id: ${{ github.run_id }}
          head_sha: ${{ github.sha }}
          workflow_name: ${{ inputs.dedupe_workflow_name }}
          force: ${{ inputs.force }}

  build:
    name: Build (${{ matrix.target }})
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.targets_json) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Zig
        uses: nullclaw/nullbuilder/.github/actions/setup-zig@v1
        with:
          version: ${{ inputs.zig_version }}

      - name: Set up Node.js
        if: inputs.node_version != '' && inputs.node_cache_dependency_path == ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Set up Node.js with npm cache
        if: inputs.node_version != '' && inputs.node_cache_dependency_path != ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.node_cache_dependency_path }}

      - name: Set up JDK 17
        if: startsWith(matrix.target, 'android-')
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: startsWith(matrix.target, 'android-')
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''

      - name: Install Android NDK
        if: startsWith(matrix.target, 'android-')
        env:
          ANDROID_NDK_VERSION: ${{ inputs.android_ndk_version }}
        run: |
          if [[ ! "${ANDROID_NDK_VERSION}" =~ ^([0-9]+)(\.[0-9]+)*$ ]]; then
            echo "invalid Android NDK version" >&2
            exit 1
          fi
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"

      - name: Export Android NDK paths
        if: startsWith(matrix.target, 'android-')
        env:
          ANDROID_API_LEVEL: ${{ inputs.android_api_level }}
          ANDROID_NDK_VERSION: ${{ inputs.android_ndk_version }}
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_ZIG_TARGET: ${{ matrix.zig_target }}
        run: |
          if [[ ! "${ANDROID_API_LEVEL}" =~ ^[1-9][0-9]{0,2}$ ]] || [[ ! "${ANDROID_NDK_VERSION}" =~ ^([0-9]+)(\.[0-9]+)*$ ]]; then
            echo "invalid Android SDK inputs" >&2
            exit 1
          fi
          if [[ ! "${MATRIX_TARGET}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || [[ "${MATRIX_TARGET}" == *..* ]] || [[ ! "${MATRIX_ZIG_TARGET}" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "invalid Android matrix target" >&2
            exit 1
          fi
          NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          SYSROOT="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          LIBC_FILE="$RUNNER_TEMP/android-libc-${MATRIX_TARGET}.txt"
          echo "ANDROID_NDK_ROOT=${NDK_ROOT}" >> "$GITHUB_ENV"
          echo "ZIG_ANDROID_SYSROOT=${SYSROOT}" >> "$GITHUB_ENV"
          echo "ZIG_ANDROID_LIBC_FILE=${LIBC_FILE}" >> "$GITHUB_ENV"
          cat > "${LIBC_FILE}" <<EOF
          include_dir=${SYSROOT}/usr/include/${MATRIX_ZIG_TARGET}
          sys_include_dir=${SYSROOT}/usr/include
          crt_dir=${SYSROOT}/usr/lib/${MATRIX_ZIG_TARGET}/${ANDROID_API_LEVEL}
          msvc_lib_dir=
          kernel32_lib_dir=
          gcc_dir=
          EOF

      - name: Run pre-build command
        if: inputs.pre_build_command != ''
        env:
          BUILD_VERSION: ${{ needs.preflight.outputs.version }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -euo pipefail -c "$PRE_BUILD_COMMAND"

      - name: Build ReleaseSmall
        env:
          ANDROID_API_LEVEL: ${{ inputs.android_api_level }}
          EXTRA_BUILD_ARGS: ${{ inputs.build_args }}
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_ZIG_CPU: ${{ matrix.zig_cpu }}
          MATRIX_ZIG_TARGET: ${{ matrix.zig_target }}
        run: |
          if [[ ! "${MATRIX_TARGET}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || [[ "${MATRIX_TARGET}" == *..* ]] || [[ ! "${MATRIX_ZIG_TARGET}" =~ ^[A-Za-z0-9._+-]+$ ]] || [[ ! "${MATRIX_ZIG_CPU}" =~ ^[A-Za-z0-9._+-]*$ ]]; then
            echo "invalid matrix target fields" >&2
            exit 1
          fi

          zig_target="${MATRIX_ZIG_TARGET}"
          if [[ "${MATRIX_TARGET}" == android-* ]]; then
            zig_target="${zig_target}.${ANDROID_API_LEVEL}"
          fi

          zig_args=(
            -Doptimize=ReleaseSmall
            "-Dtarget=${zig_target}"
            -Dversion=${{ needs.preflight.outputs.version }}
          )
          if [ -n "${MATRIX_ZIG_CPU}" ]; then
            zig_args+=("-Dcpu=${MATRIX_ZIG_CPU}")
          fi
          if [[ "${MATRIX_TARGET}" == android-* ]]; then
            zig_args+=(--libc "${ZIG_ANDROID_LIBC_FILE}")
          fi
          if [ -n "${EXTRA_BUILD_ARGS}" ]; then
            read -r -a extra_args <<< "${EXTRA_BUILD_ARGS}"
            zig_args+=("${extra_args[@]}")
          fi
          zig build "${zig_args[@]}"

      - name: Package nightly artifact
        env:
          ARTIFACT_PREFIX: ${{ needs.preflight.outputs.artifact_prefix }}
          BINARY_NAME: ${{ inputs.binary_name }}
          MATRIX_EXT: ${{ matrix.ext }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          if [[ ! "${BINARY_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || [[ "${BINARY_NAME}" == *..* ]]; then
            echo "invalid binary_name" >&2
            exit 1
          fi
          if [[ ! "${ARTIFACT_PREFIX}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || [[ "${ARTIFACT_PREFIX}" == *..* ]] || [[ ! "${MATRIX_TARGET}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || [[ "${MATRIX_TARGET}" == *..* ]] || [[ ! "${MATRIX_EXT}" =~ ^(\.[A-Za-z0-9]+)?$ ]]; then
            echo "invalid artifact naming fields" >&2
            exit 1
          fi

          mkdir -p nightly-artifacts
          binary="zig-out/bin/${BINARY_NAME}${MATRIX_EXT}"
          out="nightly-artifacts/${ARTIFACT_PREFIX}-${MATRIX_TARGET}${MATRIX_EXT}"
          cp "${binary}" "${out}"
          printf 'artifact_binary=%s\n' "${out}" >> "$GITHUB_ENV"
          printf 'built_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Write artifact metadata
        uses: nullclaw/nullbuilder/.github/actions/package-artifact@v1
        with:
          binary: ${{ env.artifact_binary }}
          target: ${{ matrix.target }}
          zig_target: ${{ matrix.zig_target }}
          version: ${{ needs.preflight.outputs.version }}
          repository: ${{ github.repository }}
          commit: ${{ github.sha }}
          run_id: ${{ github.run_id }}
          server_url: ${{ github.server_url }}
          built_at: ${{ env.built_at }}

      - name: Upload nightly artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ needs.preflight.outputs.artifact_prefix }}-nightly-${{ needs.preflight.outputs.short_sha }}-${{ matrix.target }}
          path: nightly-artifacts/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  release:
    name: Publish prerelease
    needs: [preflight, build]
    if: inputs.publish_release && needs.preflight.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download nightly artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ needs.preflight.outputs.artifact_prefix }}-nightly-${{ needs.preflight.outputs.short_sha }}-*
          path: nightly-downloads
          merge-multiple: true

      - name: Publish rolling nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          VERSION: ${{ needs.preflight.outputs.version }}
          BUILT_AT: ${{ needs.preflight.outputs.built_at }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || [[ "${RELEASE_TAG}" == *..* ]]; then
            echo "invalid release_tag: use letters, numbers, dots, underscores, and dashes" >&2
            exit 1
          fi

          mkdir -p release-output
          find nightly-downloads -maxdepth 2 -type f -exec cp '{}' release-output/ ';'

          if ! compgen -G "release-output/*" >/dev/null; then
            echo "no nightly release assets were downloaded" >&2
            exit 1
          fi

          built_label="${BUILT_AT%Z}"
          built_label="${built_label/T/ } UTC"
          release_title="${RELEASE_TITLE} ${built_label}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          cat > release-notes.md <<EOF
          Nightly build generated at ${BUILT_AT}.

          - Version: \`${VERSION}\`
          - Commit: \`${GITHUB_SHA}\`
          - Workflow run: ${run_url}
          EOF

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                [ -n "${asset}" ] || continue
                gh release delete-asset "${RELEASE_TAG}" "${asset}" --repo "${GITHUB_REPOSITORY}" --yes
              done

            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${release_title}" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false \
              --target "${GITHUB_SHA}"
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${release_title}" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false \
              --target "${GITHUB_SHA}"
          fi

          gh release upload "${RELEASE_TAG}" release-output/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
